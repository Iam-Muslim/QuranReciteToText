[package]
name = "quran-recite2text"
version = "1.0.0"
description = "Quran Recite2Text - Interactive Recitation Alignment Studio"
edition = "2021"

[lib]
name = "quran_recite2text_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
tauri = { version = "2.6.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "fs", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
lazy_static = "1.4"
tauri-plugin-updater = "2"


