<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Quran Caption</title>
<style>
  :root {
    color-scheme: dark;

    /* Eye-comfort warm charcoal theme */
    --bg: #0f1216;
    --bg-2: #14181d;
    --surface: #181d24;
    --surface-2: #1e242d;
    --line: #2b3340;
    --line-soft: #232b36;

    --text: #e8e1d3;
    --text-soft: #cfc8ba;
    --muted: #9d978a;
    --dim: #6a655c;

    --gold: #d8a75f;
    --gold-strong: #e7bd79;
    --gold-soft: rgba(216, 167, 95, 0.13);
    --gold-line: rgba(216, 167, 95, 0.38);

    --red: #cf7070;
    --red-soft: rgba(207, 112, 112, 0.10);
    --red-line: rgba(207, 112, 112, 0.38);

    --blue: #7ea6cf;
    --blue-soft: rgba(126, 166, 207, 0.10);
    --blue-line: rgba(126, 166, 207, 0.38);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: Inter, "Segoe UI", system-ui, Roboto, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 50% 18%, rgba(216, 167, 95, 0.055), transparent 55%),
      radial-gradient(900px 600px at 50% 75%, rgba(126, 166, 207, 0.02), transparent 60%),
      linear-gradient(180deg, #0e1116 0%, #10141a 48%, #0d1015 100%);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  button,
  input,
  label {
    font: inherit;
  }

  ::selection {
    background: rgba(216, 167, 95, 0.28);
    color: #fff7e6;
  }

  :focus-visible {
    outline: 2px solid rgba(216, 167, 95, 0.72);
    outline-offset: 2px;
  }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
  }

  #previewScroll {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: auto;
    padding: 26px 4vw 32px;
    -webkit-overflow-scrolling: touch;
    scrollbar-color: #3a4250 transparent;
    scrollbar-width: thin;
  }

  #preview {
    margin: auto;
    direction: rtl;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    align-items: flex-end;
    gap: 18px 24px;
    width: min(1300px, 100%);
  }

  .empty-hint {
    direction: ltr;
    color: var(--muted);
    font-size: 16px;
    text-align: center;
    padding: 24px;
    border: 1px solid var(--line-soft);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.02);
  }

  .word-block {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    border-radius: 16px;
    max-width: min(360px, 100%);
    cursor: pointer;
    transition: none;
  }

  .word-ar {
    font-family: "KFGQPC Uthmanic Script HAFS", "Amiri", "Scheherazade New",
      "Noto Naskh Arabic", "Traditional Arabic", serif;
    font-size: clamp(28px, 4.8vw, 72px);
    line-height: 1.8;
    white-space: nowrap;
    color: #5d6066;
    padding: 0 0.08em;
    max-width: 100%;
  }

  .word-block:hover .word-ar {
    color: #d6d0c3;
  }

  .word-block.past .word-ar {
    color: #a19a8b;
    opacity: 0.72;
  }

  .word-block.future .word-ar {
    color: #4f535b;
  }

  .word-block.active {
    background: var(--gold-soft);
    outline: 1px solid var(--gold-line);
    box-shadow:
      inset 0 0 0 1px rgba(216, 167, 95, 0.10),
      inset 0 0 34px rgba(216, 167, 95, 0.05);
  }

  .word-block.active .word-ar,
  .word-block.active:hover .word-ar {
    color: #fff7e6;
  }

  .word-block.missing .word-ar {
    color: #cf7070 !important;
    text-decoration: line-through rgba(207, 112, 112, 0.45);
    opacity: 0.7;
  }

  .phonemes {
    direction: rtl;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    max-width: 100%;
    min-height: 24px;
  }

  .ph {
    font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", serif;
    font-size: 13px;
    line-height: 1;
    padding: 5px 7px;
    border-radius: 8px;
    background: #1b2129;
    border: 1px solid #2d3542;
    color: #7f8695;
    cursor: pointer;
    transition: none;
  }

  .ph:hover {
    border-color: rgba(216, 167, 95, 0.65);
    color: #d8d2c5;
  }

  .ph.past {
    background: #171d25;
    color: #a2a8b4;
  }

  .ph.active,
  .ph.active:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: #231708;
    font-weight: 700;
  }

  .ph.missing {
    border-style: dashed;
    color: #cf9a9a;
    background: rgba(207, 112, 112, 0.08);
    border-color: rgba(207, 112, 112, 0.25);
    font-family: Inter, "Segoe UI", system-ui, sans-serif;
    font-size: 10px;
    letter-spacing: 0.3px;
    cursor: pointer;
  }

  .hide-phonemes .phonemes {
    display: none;
  }

  footer {
    background: rgba(13, 15, 18, 0.96);
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(10px);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px 10px;
    flex-wrap: wrap;
  }

  #playBtn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: linear-gradient(180deg, #e3b775, #cf9d52);
    color: #231708;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(216, 167, 95, 0.14);
    flex: 0 0 auto;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }

  #playBtn:hover {
    transform: scale(1.03);
  }

  #playBtn:disabled {
    background: #3a3f47;
    color: #949aa5;
    box-shadow: none;
    cursor: default;
    transform: none;
  }

  #time {
    min-width: 92px;
    color: var(--muted);
    font-size: 12px;
    direction: ltr;
    flex: 0 0 auto;
  }

  #seek {
    flex: 1;
    min-width: 150px;
    appearance: none;
    -webkit-appearance: none;
    height: 5px;
    border-radius: 999px;
    background: #2b333f;
    outline: none;
  }

  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold-strong);
    border: 3px solid #20160a;
    box-shadow: 0 0 0 1px rgba(216, 167, 95, 0.35);
    cursor: pointer;
  }

  #seek::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold-strong);
    border: 3px solid #20160a;
    box-shadow: 0 0 0 1px rgba(216, 167, 95, 0.35);
    cursor: pointer;
  }

  #seek::-moz-range-track {
    height: 5px;
    border-radius: 999px;
    background: #2b333f;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    padding: 5px 7px;
    flex: 0 0 auto;
  }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: #1b222d;
    border: 1px solid #2b3543;
    color: #dfe3e9;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .icon-btn:hover {
    background: #232d3b;
    border-color: #3a4657;
  }

  #speedValue {
    min-width: 50px;
    text-align: center;
    font-size: 12px;
    color: #b7bcc6;
    direction: ltr;
  }

  .btn,
  .toggle-btn {
    border-radius: 10px;
    padding: 8px 11px;
    background: #1b212a;
    border: 1px solid #303947;
    color: #ddd7ca;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    flex: 0 0 auto;
    white-space: nowrap;
  }

  .btn:hover,
  .toggle-btn:hover {
    background: #232b37;
    border-color: #3d4859;
  }

  .toggle-btn.active {
    background: var(--gold-soft);
    border-color: var(--gold-line);
    color: #eed8ac;
  }

  #strip {
    position: relative;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scroll-behavior: smooth;
    scrollbar-color: #3a4250 transparent;
    scrollbar-width: thin;
  }

  .chip {
    flex: 0 0 auto;
    width: 235px;
    background: #151a21;
    border: 1px solid #2a3240;
    border-radius: 12px;
    padding: 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .chip:hover {
    background: #18202a;
    border-color: #3d4858;
  }

  .chip.missing {
    background: var(--red-soft);
    border-color: var(--red-line);
  }

  .chip.missing:hover {
    border-color: rgba(207, 112, 112, 0.62);
  }

  .chip.repeated:not(.missing) {
    background: var(--blue-soft);
    border-color: var(--blue-line);
  }

  .chip.repeated:not(.missing):hover {
    border-color: rgba(126, 166, 207, 0.62);
  }

  .chip.active {
    outline: 2px solid var(--gold-strong);
    outline-offset: -2px;
  }

  .chip-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
  }

  .chip-meta {
    direction: ltr;
    text-align: left;
    font-size: 9px;
    line-height: 1.3;
    color: #918b7e;
    flex: 1;
    min-width: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .chip-flags {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .flag {
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    line-height: 1;
    border: 1px solid transparent;
  }

  .flag.repeat {
    color: #a8c4e2;
    background: rgba(126, 166, 207, 0.10);
    border-color: rgba(126, 166, 207, 0.26);
  }

  .flag.missing {
    color: #e19d9d;
    background: rgba(207, 112, 112, 0.10);
    border-color: rgba(207, 112, 112, 0.26);
  }

  .chip-text {
    direction: rtl;
    font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", serif;
    font-size: 15px;
    line-height: 1.55;
    color: #e7e0d2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #previewScroll::-webkit-scrollbar,
  #strip::-webkit-scrollbar {
    width: 9px;
    height: 9px;
  }

  #previewScroll::-webkit-scrollbar-thumb,
  #strip::-webkit-scrollbar-thumb {
    background: #3a4250;
    border-radius: 999px;
  }

  #previewScroll::-webkit-scrollbar-track,
  #strip::-webkit-scrollbar-track {
    background: transparent;
  }

  input[type="file"] {
    display: none;
  }

  @media (max-width: 820px) {
    #controls {
      gap: 8px;
    }

    .word-ar {
      font-size: clamp(24px, 7.8vw, 52px);
    }

    .chip {
      width: 190px;
    }
  }
</style>
</head>
<body>
  <main>
    <div id="previewScroll">
      <div id="preview" dir="rtl">
        <div class="empty-hint">
          Load output.json and MP3
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div id="controls">
      <button id="playBtn" disabled>▶</button>
      <div id="time">0:00 / 0:00</div>
      <input id="seek" type="range" min="0" max="0" step="0.01" value="0" />

      <div class="control-group">
        <button class="icon-btn" id="speedDownBtn">−</button>
        <div id="speedValue">1.00×</div>
        <button class="icon-btn" id="speedUpBtn">+</button>
      </div>

      <button class="toggle-btn active" id="phonemeBtn">Hide phonemes</button>
      <button class="btn" id="loadJsonBtn">Open JSON</button>
      <button class="btn" id="loadAudioBtn">Open MP3</button>
    </div>

    <div id="strip" dir="ltr"></div>
  </footer>

  <input type="file" id="jsonFile" accept=".json,application/json" />
  <input type="file" id="audioFile" accept="audio/*" />
  <audio id="audio" preload="auto"></audio>

  <!--
    If you want one single self-contained file,
    paste the full output.json content between this script tag.
    Otherwise keep output.json beside this HTML file.
  -->
  <script id="embedded-json" type="application/json">
PASTE_FULL_OUTPUT_JSON_HERE
  </script>

  <script>
    const audio = document.getElementById("audio");
    const jsonFile = document.getElementById("jsonFile");
    const audioFile = document.getElementById("audioFile");

    const loadJsonBtn = document.getElementById("loadJsonBtn");
    const loadAudioBtn = document.getElementById("loadAudioBtn");

    const previewScroll = document.getElementById("previewScroll");
    const preview = document.getElementById("preview");

    const playBtn = document.getElementById("playBtn");
    const time = document.getElementById("time");
    const seek = document.getElementById("seek");

    const speedDownBtn = document.getElementById("speedDownBtn");
    const speedUpBtn = document.getElementById("speedUpBtn");
    const speedValue = document.getElementById("speedValue");

    const phonemeBtn = document.getElementById("phonemeBtn");
    const strip = document.getElementById("strip");

    let model = [];
    let chipMap = new Map();
    let activeChip = null;
    let wordItems = [];

    let currentSeg = -1;
    let currentSub = -1;

    let phonemeHidden = false;
    let rafId = 0;
    let seekDragging = false;
    let manualTime = 0;
    let pendingSeek = null;
    let speed = 1;
    let surahNumber = "";

    init();

    function init() {
      bindEvents();
      setPhonemeHidden(false);
      updateReady();
      loadInitialData();
    }

    function loadInitialData() {
      const embedded = document.getElementById("embedded-json");

      if (
        embedded &&
        embedded.textContent.trim() &&
        !embedded.textContent.includes("PASTE_FULL_OUTPUT_JSON_HERE")
      ) {
        try {
          initModel(JSON.parse(embedded.textContent));
          return;
        } catch (err) {
          console.error("Embedded JSON error:", err);
        }
      }

      loadJsonFromUrl("output.json");
    }

    function bindEvents() {
      loadJsonBtn.addEventListener("click", () => jsonFile.click());
      loadAudioBtn.addEventListener("click", () => audioFile.click());

      jsonFile.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (file) await loadJsonFile(file);
        jsonFile.value = "";
      });

      audioFile.addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (file) loadAudioFile(file);
        audioFile.value = "";
      });

      playBtn.addEventListener("click", togglePlay);

      audio.addEventListener("play", () => {
        playBtn.textContent = "❚❚";
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(frame);
      });

      audio.addEventListener("pause", () => {
        playBtn.textContent = "▶";
        cancelAnimationFrame(rafId);
        refreshOnce();
      });

      audio.addEventListener("ended", () => {
        playBtn.textContent = "▶";
        cancelAnimationFrame(rafId);
        refreshOnce();
      });

      audio.addEventListener("loadedmetadata", () => {
        if (pendingSeek != null) {
          try {
            audio.currentTime = pendingSeek;
          } catch (e) {}
          pendingSeek = null;
        }

        seek.max = getTotalDuration();
        refreshOnce();
      });

      speedDownBtn.addEventListener("click", () => changeSpeed(-0.1));
      speedUpBtn.addEventListener("click", () => changeSpeed(0.1));

      phonemeBtn.addEventListener("click", () => {
        setPhonemeHidden(!phonemeHidden);
      });

      seek.addEventListener("pointerdown", () => {
        seekDragging = true;
      });

      window.addEventListener("pointerup", () => {
        seekDragging = false;
      });

      seek.addEventListener("input", () => {
        seekTo(parseFloat(seek.value) || 0);
      });

      window.addEventListener("dragover", (e) => {
        e.preventDefault();
      });

      window.addEventListener("drop", async (e) => {
        e.preventDefault();

        const files = Array.from(e.dataTransfer.files || []);

        for (const file of files) {
          const isJson =
            file.type.includes("json") ||
            file.name.toLowerCase().endsWith(".json");

          const isAudio =
            file.type.startsWith("audio/") ||
            /\.(mp3|wav|m4a|aac|ogg|oga|flac)$/i.test(file.name);

          if (isJson) {
            await loadJsonFile(file);
          } else if (isAudio) {
            loadAudioFile(file);
          }
        }
      });
    }

    async function loadJsonFromUrl(url) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);

        const json = await res.json();
        initModel(json);
      } catch (err) {
        // If automatic loading fails, use Open JSON button.
      }
    }

    async function loadJsonFile(file) {
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        initModel(json);
      } catch (err) {
        alert("JSON error: " + err.message);
      }
    }

    function loadAudioFile(file) {
      audio.src = URL.createObjectURL(file);
      audio.load();

      if (manualTime > 0) {
        pendingSeek = manualTime;
      }

      updateReady();
      refreshOnce();
    }

    function initModel(rawJson) {
      const normalized = normalizeKeys(rawJson);

      surahNumber = str(findSurahNumber(normalized));
      const segments = findSegments(normalized);

      if (!Array.isArray(segments) || segments.length === 0) {
        alert("No segments found in JSON.");
        return;
      }

      model = buildModel(segments);

      const intro = findIntro(normalized);
      if (intro && Array.isArray(intro.words) && intro.words.length) {
        const introSeg = buildIntroModel(intro);
        if (introSeg) {
          model.unshift(introSeg);
        }
      }

      buildStrip();

      if (model.length > 0) {
        setCurrent(0, 0);
      }

      seek.max = getTotalDuration();
      updateReady();
      refreshOnce();
    }

    function normalizeKeys(value) {
      if (Array.isArray(value)) {
        return value.map(normalizeKeys);
      }

      if (value && typeof value === "object") {
        const out = {};

        for (const [key, val] of Object.entries(value)) {
          out[key.trim()] = normalizeKeys(val);
        }

        return out;
      }

      return value;
    }

    function findSurahNumber(obj) {
      if (!obj || typeof obj !== "object") return "";

      if (obj.surah !== undefined) return obj.surah;
      if (obj.surah_number !== undefined) return obj.surah_number;

      if (Array.isArray(obj)) {
        for (const item of obj) {
          const found = findSurahNumber(item);
          if (found !== "") return found;
        }
        return "";
      }

      if (obj.surahs) {
        const found = findSurahNumber(obj.surahs);
        if (found !== "") return found;
      }

      for (const value of Object.values(obj)) {
        const found = findSurahNumber(value);
        if (found !== "") return found;
      }

      return "";
    }

    function findIntro(obj) {
      if (!obj || typeof obj !== "object") return null;
      if (obj.intro && typeof obj.intro === "object") return obj.intro;
      if (Array.isArray(obj.surahs) && obj.surahs[0]?.intro) return obj.surahs[0].intro;
      for (const value of Object.values(obj)) {
        if (value && typeof value === "object") {
          const found = findIntro(value);
          if (found) return found;
        }
      }
      return null;
    }

    function buildIntroModel(intro) {
      const iStart = num(intro.start);
      const iEnd = num(intro.end);
      const iText = str(intro.transcribed_text || intro.text || "Intro");

      const words = (Array.isArray(intro.words) ? intro.words : []).map((w, wIdx) => {
        const wStart = num(w.start, iStart);
        const wEnd = num(w.end, iEnd);
        let phs = Array.isArray(w.phonemes)
          ? w.phonemes.map((p, pIdx) => ({
              index: pIdx,
              text: str(p.phoneme || p.text),
              start: num(p.start, wStart),
              end: num(p.end, wEnd)
            }))
          : [];
        if (phs.length === 0) {
          phs = [{ index: 0, text: str(w.word), start: wStart, end: wEnd }];
        }
        return {
          index: wIdx,
          text: str(w.word || "•"),
          location: str(w.location),
          start: wStart,
          end: wEnd,
          score: num(w.score, 1),
          is_missing: false,
          phonemes: phs
        };
      });

      return {
        index: 0,
        number: "Intro",
        start: iStart,
        end: iEnd,
        text: iText,
        ref: "Intro",
        repeated: false,
        missing: false,
        sub_segments: [
          {
            index: 0,
            number: "Intro",
            start: iStart,
            end: iEnd,
            text: iText,
            range: "",
            repeated: false,
            missing: false,
            words: words
          }
        ]
      };
    }

    function findSegments(obj) {
      if (!obj) return [];

      if (Array.isArray(obj.surahs)) {
        let all = [];
        for (const s of obj.surahs) {
          if (Array.isArray(s.ayahs)) all.push(...s.ayahs);
          else if (Array.isArray(s.segments)) all.push(...s.segments);
        }
        if (all.length) return all;
      }

      if (Array.isArray(obj.ayahs)) {
        return obj.ayahs;
      }

      if (Array.isArray(obj.segments)) {
        return obj.segments;
      }

      if (Array.isArray(obj)) {
        if (obj.length && Array.isArray(obj[0]?.ayahs)) {
          return obj.flatMap((s) => s.ayahs || []);
        }
        if (obj.length && Array.isArray(obj[0]?.segments)) {
          return obj.flatMap((s) => s.segments || []);
        }

        if (
          obj.length &&
          (
            obj[0]?.ayah !== undefined ||
            obj[0]?.ayah_number !== undefined ||
            obj[0]?.sub_segments !== undefined ||
            obj[0]?.segments !== undefined ||
            obj[0]?.words !== undefined ||
            obj[0]?.start !== undefined ||
            obj[0]?.start_time !== undefined
          )
        ) {
          return obj;
        }

        for (const item of obj) {
          const found = findSegments(item);
          if (found.length) return found;
        }

        return [];
      }

      for (const value of Object.values(obj)) {
        if (value && typeof value === "object") {
          const found = findSegments(value);
          if (found.length) return found;
        }
      }

      return [];
    }

    function buildModel(segments) {
      return segments.map((segment, segmentIndex) => {
        const segStart = num(segment.start !== undefined ? segment.start : segment.start_time);
        const segEnd = num(segment.end !== undefined ? segment.end : segment.end_time);
        const segText = str(segment.transcribed_text || segment.matched_text || segment.text);

        const repeated = bool(
          segment.has_repeated_words ||
          (Array.isArray(segment.repeated_ranges) && segment.repeated_ranges.length > 0)
        );
        const missingSegment = bool(segment.has_missing_words);

        let rawSubs = Array.isArray(segment.segments)
          ? segment.segments
          : Array.isArray(segment.sub_segments)
          ? segment.sub_segments
          : [];

        if (rawSubs.length === 0) {
          rawSubs = [
            {
              segment: 1,
              start: segStart,
              end: segEnd,
              transcribed_text: segText,
              words_range: str(segment.matched_ref),
              words: Array.isArray(segment.words) ? segment.words : []
            }
          ];
        }

        const subCount = rawSubs.length;
        const ayahNum = segment.ayah !== undefined
          ? segment.ayah
          : (segment.ayah_number !== undefined ? segment.ayah_number : segment.segment_number);

        return {
          index: segmentIndex,
          number: ayahNum !== undefined ? ayahNum : segmentIndex + 1,
          start: segStart,
          end: segEnd,
          text: segText,
          ref: str(segment.matched_ref),
          repeated,
          missing: missingSegment,

          sub_segments: rawSubs.map((sub, subIndex) => {
            const subStart = num(sub.start !== undefined ? sub.start : sub.start_time, segStart);
            const subEnd = num(sub.end !== undefined ? sub.end : sub.end_time, segEnd);
            const subText = str(sub.transcribed_text || sub.text || segText);
            const subRange = str(sub.words_range || segment.matched_ref);
            const subRepeated = bool(sub.is_repetition || (repeated && subIndex > 0));

            let rawWords = Array.isArray(sub.words) ? sub.words : [];

            if (rawWords.length === 0 && subText) {
              rawWords = [
                {
                  word: subText,
                  location: "",
                  start: subStart,
                  end: subEnd,
                  score: 1,
                  phonemes: []
                }
              ];
            }

            const words = rawWords.map((word, wordIndex) => {
              const wordText = str(word.word || word.text || subText);
              const isMissingWord = bool(word.is_missing || (word.start === null && word.end === null) || word.score <= 0);
              const wordStart = isMissingWord ? subStart : num(word.start, subStart);
              const wordEnd = isMissingWord ? subStart : num(word.end, subEnd);
              const score = isMissingWord ? 0 : num(word.score, 1);

              let phonemes = Array.isArray(word.phonemes)
                ? word.phonemes.map((phoneme, phonemeIndex) => ({
                    index: phonemeIndex,
                    text: str(phoneme.phoneme || phoneme.text),
                    start: num(phoneme.start, wordStart),
                    end: num(phoneme.end, wordEnd)
                  }))
                : [];

              if (phonemes.length === 0 && score > 0 && !isMissingWord) {
                phonemes = [
                  {
                    index: 0,
                    text: wordText,
                    start: wordStart,
                    end: wordEnd
                  }
                ];
              }

              return {
                index: wordIndex,
                text: wordText || word.location || "•",
                location: str(word.location),
                start: wordStart,
                end: wordEnd,
                score,
                is_missing: isMissingWord,
                phonemes
              };
            });

            const localMissing = words.some((w) => w.is_missing || w.score <= 0);
            const missing = localMissing || (missingSegment && subCount === 1);
            const segNum = sub.segment !== undefined
              ? sub.segment
              : (sub.segment_number !== undefined ? sub.segment_number : sub.sub_segment);

            return {
              index: subIndex,
              number: segNum !== undefined ? segNum : subIndex + 1,
              start: subStart,
              end: subEnd,
              text: subText,
              range: subRange,
              repeated: subRepeated,
              missing,
              words
            };
          })
        };
      });
    }

    function buildStrip() {
      strip.innerHTML = "";
      chipMap.clear();
      activeChip = null;

      model.forEach((segment, segmentIndex) => {
        const subCount = segment.sub_segments.length;
        segment.sub_segments.forEach((sub, subIndex) => {
          const chip = document.createElement("div");
          chip.className = "chip";

          if (sub.missing) chip.classList.add("missing");
          if (sub.repeated) chip.classList.add("repeated");

          const head = document.createElement("div");
          head.className = "chip-head";

          const metaLine = document.createElement("div");
          metaLine.className = "chip-meta";

          const metaParts = [
            "Surah " + (surahNumber || "?")
          ];

          if (segment.number === "Intro") {
            metaParts.push("Intro");
          } else {
            metaParts.push("Ayah " + segment.number);
            if (subCount > 1) {
              metaParts.push("Seg " + sub.number);
            }
          }

          if (sub.range) {
            metaParts.push(sub.range);
          }

          metaLine.textContent = metaParts.join(" · ");

          const flags = document.createElement("div");
          flags.className = "chip-flags";

          if (sub.repeated) {
            flags.appendChild(makeFlag("repeat", "↻", "Repetition"));
          }

          if (sub.missing) {
            flags.appendChild(makeFlag("missing", "!", "Missing word"));
          }

          head.appendChild(metaLine);
          head.appendChild(flags);

          const text = document.createElement("div");
          text.className = "chip-text";
          text.textContent = sub.text || segment.text || "...";

          const tags = [];
          if (sub.missing) tags.push("missing");
          if (sub.repeated) tags.push("repetition");

          text.title =
            (sub.text || segment.text || "") +
            (tags.length ? "\nFlags: " + tags.join(", ") : "");

          chip.appendChild(head);
          chip.appendChild(text);

          chip.addEventListener("click", () => {
            seekTo(sub.start + 0.0001);
          });

          chipMap.set(segmentIndex + ":" + subIndex, chip);
          strip.appendChild(chip);
        });
      });
    }

    function makeFlag(type, symbol, title) {
      const flag = document.createElement("span");
      flag.className = "flag " + type;
      flag.textContent = symbol;
      flag.title = title;
      return flag;
    }

    function setCurrent(segmentIndex, subIndex) {
      if (!model.length) return;

      currentSeg = Math.max(0, Math.min(segmentIndex, model.length - 1));

      const segment = model[currentSeg];
      currentSub = Math.max(
        0,
        Math.min(subIndex, segment.sub_segments.length - 1)
      );

      renderCurrentSub();
      updateActiveChip();
      updateHighlight(getCurrentTime());
    }

    function renderCurrentSub() {
      wordItems = [];
      preview.innerHTML = "";
      previewScroll.scrollTop = 0;

      const segment = model[currentSeg];
      if (!segment) return;

      const sub = segment.sub_segments[currentSub];
      if (!sub) return;

      const renderWords = sub.words.length
        ? sub.words
        : [
            {
              text: sub.text || segment.text || "",
              start: sub.start,
              end: sub.end,
              score: 1,
              phonemes: [
                {
                  index: 0,
                  text: sub.text || segment.text || "",
                  start: sub.start,
                  end: sub.end
                }
              ]
            }
          ];

      renderWords.forEach((word) => {
        const block = document.createElement("div");
        block.className = "word-block future";
        if (word.is_missing) {
          block.classList.add("missing");
        }

        block.addEventListener("click", () => {
          if (!word.is_missing && word.start !== null) {
            seekTo(word.start + 0.0001);
          }
        });

        const ar = document.createElement("div");
        ar.className = "word-ar";
        ar.textContent = word.text;

        const phRow = document.createElement("div");
        phRow.className = "phonemes";

        const phEls = [];

        if (word.phonemes.length) {
          word.phonemes.forEach((phoneme) => {
            const ph = document.createElement("span");
            ph.className = "ph future";
            ph.textContent = phoneme.text || "•";

            ph.addEventListener("click", (e) => {
              e.stopPropagation();
              seekTo(phoneme.start + 0.0001);
            });

            phRow.appendChild(ph);

            phEls.push({
              el: ph,
              index: phoneme.index,
              start: phoneme.start,
              end: phoneme.end
            });
          });
        } else {
          const ph = document.createElement("span");
          ph.className = "ph missing";
          ph.textContent = word.is_missing || word.score <= 0 ? "missing" : "—";

          ph.addEventListener("click", (e) => {
            e.stopPropagation();
            if (!word.is_missing && word.start !== null) {
              seekTo(word.start + 0.0001);
            }
          });

          phRow.appendChild(ph);
        }

        block.appendChild(ar);
        block.appendChild(phRow);
        preview.appendChild(block);

        wordItems.push({
          block,
          start: word.start,
          end: word.end,
          score: word.score,
          phEls
        });
      });
    }

    function updateActiveChip() {
      if (activeChip) {
        activeChip.classList.remove("active");
        activeChip = null;
      }

      const chip = chipMap.get(currentSeg + ":" + currentSub);
      if (!chip) return;

      chip.classList.add("active");
      activeChip = chip;

      const target =
        chip.offsetLeft - (strip.clientWidth - chip.offsetWidth) / 2;

      strip.scrollTo({
        left: Math.max(0, target),
        behavior: "smooth"
      });
    }

    function frame() {
      if (audio.paused) return;

      const t = audio.currentTime;
      const pos = findPosition(t);

      if (pos && (pos.seg !== currentSeg || pos.sub !== currentSub)) {
        setCurrent(pos.seg, pos.sub);
      }

      updateHighlight(t);
      updateTime(t);
      updateSeek(t);

      rafId = requestAnimationFrame(frame);
    }

    function refreshOnce() {
      if (!model.length) return;

      const t = getCurrentTime();
      const pos = findPosition(t);

      if (pos && (pos.seg !== currentSeg || pos.sub !== currentSub)) {
        setCurrent(pos.seg, pos.sub);
      } else {
        updateActiveChip();
        updateHighlight(t);
      }

      updateTime(t);
      updateSeek(t);
    }

    function findPosition(t) {
      if (!model.length) return null;

      let segmentIndex = 0;

      for (let i = 0; i < model.length; i++) {
        if (t >= model[i].start) {
          segmentIndex = i;
        } else {
          break;
        }
      }

      const segment = model[segmentIndex];
      let subIndex = 0;

      for (let j = 0; j < segment.sub_segments.length; j++) {
        if (t >= segment.sub_segments[j].start) {
          subIndex = j;
        } else {
          break;
        }
      }

      return {
        seg: segmentIndex,
        sub: subIndex
      };
    }

    function updateHighlight(t) {
      const segment = model[currentSeg];
      if (!segment) return;

      const sub = segment.sub_segments[currentSub];
      if (!sub) return;

      const inSub = t >= sub.start && t <= sub.end;

      let activeWord = -1;

      for (let i = 0; i < wordItems.length; i++) {
        if (t >= wordItems[i].start) {
          activeWord = i;
        } else {
          break;
        }
      }

      if (activeWord >= 0) {
        const w = wordItems[activeWord];

        if (!inSub || t > w.end || w.score <= 0) {
          activeWord = -1;
        }
      }

      wordItems.forEach((w, i) => {
        let cls = "word-block";

        if (i === activeWord) {
          cls += " active";
        } else if (t >= w.end) {
          cls += " past";
        } else {
          cls += " future";
        }

        if (w.block.className !== cls) {
          w.block.className = cls;
        }

        if (!phonemeHidden) {
          let activePhoneme = -1;
          let activePhonemeEnd = -1;

          if (i === activeWord) {
            for (const p of w.phEls) {
              if (t >= p.start) {
                activePhoneme = p.index;
                activePhonemeEnd = p.end;
              } else {
                break;
              }
            }

            if (activePhoneme >= 0 && t > activePhonemeEnd) {
              activePhoneme = -1;
            }
          }

          w.phEls.forEach((p) => {
            let phCls = "ph";

            if (i === activeWord && p.index === activePhoneme) {
              phCls += " active";
            } else if (t >= p.end) {
              phCls += " past";
            } else {
              phCls += " future";
            }

            if (p.el.className !== phCls) {
              p.el.className = phCls;
            }
          });
        }
      });
    }

    async function togglePlay() {
      if (!audio.src || !model.length) return;

      if (audio.paused) {
        try {
          await audio.play();
        } catch (err) {
          alert("Audio play error: " + err.message);
        }
      } else {
        audio.pause();
      }
    }

    function changeSpeed(delta) {
      speed = Math.min(
        3,
        Math.max(0.25, Math.round((speed + delta) * 100) / 100)
      );

      audio.playbackRate = speed;
      speedValue.textContent = speed.toFixed(2) + "×";
    }

    function setPhonemeHidden(hidden) {
      phonemeHidden = hidden;

      preview.classList.toggle("hide-phonemes", hidden);

      phonemeBtn.textContent = hidden ? "Show phonemes" : "Hide phonemes";
      phonemeBtn.classList.toggle("active", !hidden);

      refreshOnce();
    }

    function getCurrentTime() {
      if (audio.src) {
        return pendingSeek != null ? pendingSeek : audio.currentTime;
      }

      return manualTime;
    }

    function seekTo(t) {
      const total = getTotalDuration();

      if (total > 0) {
        t = Math.max(0, Math.min(t, total));
      } else {
        t = Math.max(0, t);
      }

      if (audio.src) {
        if (audio.readyState >= 1) {
          try {
            audio.currentTime = t;
          } catch (e) {}
        } else {
          pendingSeek = t;
        }
      } else {
        manualTime = t;
      }

      refreshOnce();
    }

    function getTotalDuration() {
      const d = audio.duration;

      if (isFinite(d) && d > 0) {
        return d;
      }

      if (model.length) {
        return model[model.length - 1].end;
      }

      return 0;
    }

    function updateTime(t) {
      time.textContent =
        formatTime(t) + " / " + formatTime(getTotalDuration());
    }

    function updateSeek(t) {
      const total = getTotalDuration();

      if (total > 0 && String(seek.max) !== String(total)) {
        seek.max = total;
      }

      if (!seekDragging) {
        seek.value = t;
      }
    }

    function updateReady() {
      playBtn.disabled = !audio.src || model.length === 0;
    }

    function formatTime(value) {
      if (!isFinite(value)) value = 0;

      const m = Math.floor(value / 60);
      const s = Math.floor(value % 60);

      return m + ":" + String(s).padStart(2, "0");
    }

    function num(value, fallback = 0) {
      if (typeof value === "number") {
        return Number.isFinite(value) ? value : fallback;
      }

      if (value == null) return fallback;

      const n = parseFloat(String(value).trim());
      return Number.isFinite(n) ? n : fallback;
    }

    function str(value) {
      return value == null ? "" : String(value).trim();
    }

    function bool(value) {
      return value === true || value === "true" || value === 1 || value === "1";
    }
  </script>
</body>
