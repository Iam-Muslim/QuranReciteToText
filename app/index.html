<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Recite2Text" />
    <meta name="description" content="Offline Quran recitation studio — align recitations, import timings, export word-timed text. Runs in the browser." />
    <title>Quran Recite2Text</title>
    <!-- Fonts are self-hosted in /fonts (Cairo, JetBrains Mono, KFGQPC Hafs) - 100% offline -->
    <script>
      // Apply persisted theme before first paint (no flash)
      try {
        var t = localStorage.getItem('quran_theme') || 'dark';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
