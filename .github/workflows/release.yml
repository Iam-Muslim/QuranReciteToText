name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      draft:
        description: 'Create as draft release?'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: false
        type: boolean

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles app,dmg'
            assetNamePattern: 'QuranRecite2Text.MacOS.ARM[ext]'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles app,dmg'
            assetNamePattern: 'QuranRecite2Text.MacOS.Intel[ext]'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--bundles nsis'
            assetNamePattern: 'QuranRecite2Text.Windows[ext]'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            args: '--bundles appimage,deb'
            assetNamePattern: 'QuranRecite2Text.Linux[ext]'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure build environment
        run: |
          echo "CARGO_BUILD_JOBS=2" >> $GITHUB_ENV
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $GITHUB_ENV
        shell: bash

      # ─── macOS binary setup ───
      - name: Install ffmpeg and copy binaries (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          if brew list --versions openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1
          fi
          brew install ffmpeg
          mkdir -p app/src-tauri/binaries
          cp "$(brew --prefix ffmpeg)/bin/ffprobe" app/src-tauri/binaries/ffprobe
          cp "$(brew --prefix ffmpeg)/bin/ffmpeg" app/src-tauri/binaries/ffmpeg
          chmod +x app/src-tauri/binaries/ffprobe
          chmod +x app/src-tauri/binaries/ffmpeg

      # ─── Windows binary setup ───
      - name: Download and extract ffmpeg and ffprobe (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $binDir = "app/src-tauri/binaries"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null

          $ffmpegArchive = "ffmpeg.7z"
          curl.exe -L -o $ffmpegArchive "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-full.7z"

          $extractDir = "ffmpeg-extracted"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            curl.exe -L -o 7zr.exe "https://www.7-zip.org/a/7zr.exe"
            $sevenZip = (Resolve-Path ".\7zr.exe").Path
          }
          & $sevenZip x $ffmpegArchive "-o$extractDir" -y

          $rootDir = Get-ChildItem -Directory -Path $extractDir | Select-Object -First 1
          Copy-Item -Path (Join-Path $rootDir.FullName "bin/ffmpeg.exe") -Destination $binDir -Force
          Copy-Item -Path (Join-Path $rootDir.FullName "bin/ffprobe.exe") -Destination $binDir -Force

      # ─── Linux binary & library setup ───
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev file curl ca-certificates xz-utils libssl-dev libfuse2
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
          sudo apt-get install -y libwebkit2gtk-4.1-dev || sudo apt-get install -y libwebkit2gtk-4.0-dev
          sudo apt-get install -y xdg-utils desktop-file-utils

      - name: Download and extract ffmpeg and ffprobe (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p app/src-tauri/binaries
          curl -L -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          rm -rf ffmpeg-extracted
          mkdir ffmpeg-extracted
          tar -xJf ffmpeg.tar.xz -C ffmpeg-extracted
          ffmpeg_bin=$(find ffmpeg-extracted -type f -name ffmpeg | head -n 1)
          ffprobe_bin=$(find ffmpeg-extracted -type f -name ffprobe | head -n 1)
          if [ -z "$ffmpeg_bin" ] || [ -z "$ffprobe_bin" ]; then
            echo "Unable to find ffmpeg/ffprobe in extracted archive"
            exit 1
          fi
          cp "$ffmpeg_bin" app/src-tauri/binaries/ffmpeg
          cp "$ffprobe_bin" app/src-tauri/binaries/ffprobe
          chmod +x app/src-tauri/binaries/ffmpeg app/src-tauri/binaries/ffprobe

      # ─── Build & Publish ───
      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci || npm install

      - name: Build Frontend Assets
        working-directory: app
        run: npm run build

      - name: Build & Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './app'
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Quran Recite2Text ${{ inputs.tag || github.ref_name }}'
          releaseBody: 'See release notes below for changes and improvements.'
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          args: ${{ matrix.args }}
          assetNamePattern: ${{ matrix.assetNamePattern }}
        timeout-minutes: 60
