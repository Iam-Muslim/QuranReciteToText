<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Word Timing Viewer (Advanced)</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.8);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(125, 211, 252, 0.05), transparent 25%);
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* Setup / Upload Screen */
        #setupScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .setup-card {
            padding: 40px;
            border-radius: 24px;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .setup-card h1 {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .setup-card p {
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .file-inputs {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .file-input-group {
            background: rgba(0, 0, 0, 0.3);
            border: 1px dashed var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: right;
            transition: all 0.3s ease;
            position: relative;
        }

        .file-input-group:hover {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }

        .file-input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .file-input-group input[type="file"] {
            width: 100%;
            color: var(--text-main);
            font-family: inherit;
        }

        /* Main Player Screen */
        #mainScreen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Bar */
        .top-bar {
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .segment-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        /* Text Display Area */
        .lyrics-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 60px 20px 180px 20px; /* Extra bottom padding for floating player */
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        .text-display {
            font-family: 'Amiri', serif;
            font-size: 4rem; /* Massive text for focus */
            line-height: 2.2;
            text-align: center;
            max-width: 1100px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px 24px;
            direction: rtl;
        }

        .word {
            display: inline-block;
            cursor: pointer;
            position: relative;
            /* Advanced Karaoke Fill Setup */
            color: rgba(255, 255, 255, 0.15); /* Dimmed base color */
            background-image: linear-gradient(to left, var(--accent) var(--fill, 0%), rgba(255, 255, 255, 0.15) var(--fill, 0%));
            background-clip: text;
            -webkit-background-clip: text;
            /* Transition specifically for smooth wiping if frame drops */
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), text-shadow 0.2s ease;
            text-shadow: 0 0 0px transparent;
        }

        /* When the word is fully active, give it a beautiful glow and pop */
        .word.active-glow {
            transform: scale(1.1);
            text-shadow: 0 0 25px var(--accent-glow);
            z-index: 10;
        }

        .word.missing-word {
            color: #ef4444;
            border-bottom: 3px dashed rgba(239, 68, 68, 0.5);
            background-image: none;
            -webkit-text-fill-color: #ef4444;
            cursor: not-allowed;
            text-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }
        
        .word:not(.missing-word):hover {
            color: var(--text-main);
            background-image: none;
            -webkit-text-fill-color: var(--text-main);
        }

        /* Custom Floating Audio Player */
        .floating-player {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            border-radius: 20px;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 20;
        }

        .timeline-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            border-radius: 4px;
            box-shadow: 0 0 10px var(--accent-glow);
            pointer-events: none;
        }
        
        .controls-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-controls {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:hover {
            color: var(--accent);
            transform: scale(1.15);
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background: var(--accent);
            color: var(--bg-color);
            border-radius: 50%;
            font-size: 1.5rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .play-btn:hover {
            color: var(--bg-color);
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- Setup Screen -->
    <div id="setupScreen">
        <div class="glass-panel setup-card">
            <h1>Quran Viewer</h1>
            <p>Advanced Synchronized Word-by-Word Playback</p>
            
            <div class="file-inputs">
                <div class="file-input-group">
                    <label>1. Select JSON File (output.json)</label>
                    <input type="file" id="jsonInput" accept=".json">
                </div>
                <div class="file-input-group">
                    <label>2. Select Audio File</label>
                    <input type="file" id="audioInput" accept="audio/*">
                </div>
            </div>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="mainScreen">
        <!-- Hidden Audio Element -->
        <audio id="audioPlayer"></audio>

        <div class="glass-panel top-bar">
            <div>
                <span class="segment-badge" id="segmentBadge">Segment --</span>
            </div>
            <div style="color: var(--text-muted); font-size: 1rem; font-weight: 500;" id="refDisplay">
                Surah: -- | Ayah: --
            </div>
            <div>
                <button class="ctrl-btn" onclick="location.reload()" title="Load New Files" style="font-size: 1.2rem;"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="lyrics-container" id="lyricsContainer">
            <div class="text-display" id="textDisplay">
                <!-- Words injected here -->
            </div>
        </div>

        <div class="glass-panel floating-player">
            <div class="timeline-wrapper">
                <span id="currentTime">0:00</span>
                <div class="progress-bar-container" id="progressBarContainer">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
            
            <div class="controls-wrapper">
                <div class="main-controls">
                    <button class="ctrl-btn" id="prevSegBtn" title="Previous Segment"><i class="fas fa-step-backward"></i></button>
                    <button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                    <button class="ctrl-btn" id="nextSegBtn" title="Next Segment"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const jsonInput = document.getElementById('jsonInput');
        const audioInput = document.getElementById('audioInput');
        const setupScreen = document.getElementById('setupScreen');
        const mainScreen = document.getElementById('mainScreen');
        
        const audioPlayer = document.getElementById('audioPlayer');
        const textDisplay = document.getElementById('textDisplay');
        const lyricsContainer = document.getElementById('lyricsContainer');
        
        const segmentBadge = document.getElementById('segmentBadge');
        const refDisplay = document.getElementById('refDisplay');
        
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevSegBtn = document.getElementById('prevSegBtn');
        const nextSegBtn = document.getElementById('nextSegBtn');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const progressBarContainer = document.getElementById('progressBarContainer');
        const progressBarFill = document.getElementById('progressBarFill');

        // State
        let segmentsData = [];
        let validSegments = [];
        let allWords = []; // Flattened array of all words with absolute times
        let isRelative = false;
        let isPlaying = false;
        let animationFrameId = null;

        // --- File Handling ---
        jsonInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    let rawSegments = data.segments || data;
                    
                    validSegments = rawSegments.filter(s => s.words && s.words.length > 0);
                    
                    if (validSegments.length === 0) {
                        alert("No words found in JSON!");
                        return;
                    }

                    // Smart detection: Are timestamps relative?
                    const firstSeg = validSegments.find(s => s.time_from > 5.0);
                    if (firstSeg && firstSeg.words[0].start < 5.0) {
                        isRelative = true;
                    } else {
                        isRelative = false;
                    }

                    processSegments();
                    checkReady();
                } catch (err) {
                    alert("Error parsing JSON file: " + err.message);
                }
            };
            reader.readAsText(file);
        });

        audioInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const url = URL.createObjectURL(file);
            audioPlayer.src = url;
            
            audioPlayer.onloadedmetadata = () => {
                totalTimeEl.textContent = formatTime(audioPlayer.duration);
            };
            
            checkReady();
        });

        function checkReady() {
            if (validSegments.length > 0 && audioPlayer.src) {
                setupScreen.style.opacity = '0';
                setTimeout(() => {
                    setupScreen.style.display = 'none';
                    mainScreen.style.display = 'flex';
                    renderAllWords();
                }, 500);
            }
        }

        // --- Data Processing ---
        function processSegments() {
            allWords = [];
            validSegments.forEach(seg => {
                const segTimeFrom = seg.time_from || 0.0;
                
                seg.words.forEach((w, wIdx) => {
                    if (w.is_missing || w.start === null || w.end === null) {
                        // Register missing words so they render, but assign dummy times
                        allWords.push({
                            text: w.word,
                            is_missing: true,
                            start: -1,
                            end: -1,
                            duration: 0,
                            segment: seg.segment,
                            ref: `${seg.ref_from} to ${seg.ref_to}`,
                            id: `word_${allWords.length}`
                        });
                        return;
                    }
                    
                    let absoluteStart = isRelative ? (w.start + segTimeFrom) : w.start;
                    let absoluteEnd = isRelative ? (w.end + segTimeFrom) : w.end;
                    
                    absoluteStart = Math.round(absoluteStart * 1000) / 1000;
                    absoluteEnd = Math.round(absoluteEnd * 1000) / 1000;
                    
                    allWords.push({
                        text: w.word,
                        is_missing: false,
                        start: absoluteStart,
                        end: absoluteEnd,
                        duration: absoluteEnd - absoluteStart,
                        segment: seg.segment,
                        ref: `${seg.ref_from} to ${seg.ref_to}`,
                        id: `word_${allWords.length}`
                    });
                });
            });
        }

        // --- Rendering ---
        function renderAllWords() {
            textDisplay.innerHTML = '';
            
            // Render all words flat. We rely on CSS variable --fill for rendering.
            allWords.forEach(word => {
                const span = document.createElement('span');
                span.className = 'word';
                span.id = word.id;
                span.textContent = word.text;
                
                if (word.is_missing) {
                    span.classList.add('missing-word');
                } else {
                    // Allow clicking a word to jump to its exact time
                    span.addEventListener('click', () => {
                        audioPlayer.currentTime = word.start;
                        if (!isPlaying) togglePlay();
                    });
                }

                textDisplay.appendChild(span);
            });
        }

        // --- Playback Engine (60fps Karaoke Sync) ---
        function updateKaraokeSync() {
            if (!audioPlayer.src) return;
            
            const t = audioPlayer.currentTime;
            
            // Update UI Timeline
            currentTimeEl.textContent = formatTime(t);
            if (audioPlayer.duration) {
                progressBarFill.style.width = `${(t / audioPlayer.duration) * 100}%`;
            }

            let activeSegmentId = null;
            let activeRef = null;
            let activeElementToScroll = null;

            // Iterate over all words
            for (let i = 0; i < allWords.length; i++) {
                const w = allWords[i];
                const span = document.getElementById(w.id);
                if (!span) continue;

                if (t >= w.start && t <= w.end) {
                    // Word is CURRENTLY active
                    // Calculate precise fill percentage based on duration
                    let progress = (t - w.start) / w.duration;
                    progress = Math.max(0, Math.min(1, progress)); // Clamp 0-1
                    
                    span.style.setProperty('--fill', `${progress * 100}%`);
                    span.style.webkitTextFillColor = 'transparent'; // Ensure gradient applies
                    
                    if (!span.classList.contains('active-glow')) {
                        span.classList.add('active-glow');
                        activeElementToScroll = span;
                    }
                    
                    activeSegmentId = w.segment;
                    activeRef = w.ref;
                } else if (t > w.end) {
                    // Word has passed
                    span.style.setProperty('--fill', '100%');
                    span.classList.remove('active-glow');
                    span.style.webkitTextFillColor = 'var(--accent)'; // Solid color when done
                } else {
                    // Word is in the future
                    span.style.setProperty('--fill', '0%');
                    span.classList.remove('active-glow');
                    span.style.webkitTextFillColor = 'rgba(255, 255, 255, 0.15)'; // Dimmed
                }
            }

            // Update Top Bar
            if (activeSegmentId) {
                segmentBadge.textContent = `Segment ${activeSegmentId}`;
                refDisplay.textContent = activeRef;
            }

            // Smooth Auto-scroll to keep active word centered vertically
            if (activeElementToScroll && isPlaying) {
                const containerRect = lyricsContainer.getBoundingClientRect();
                const wordRect = activeElementToScroll.getBoundingClientRect();
                
                // If word is away from the vertical center, scroll towards it
                const relativeY = wordRect.top - containerRect.top;
                const targetY = containerRect.height / 2;
                
                if (Math.abs(relativeY - targetY) > 80) { // Deadzone
                    lyricsContainer.scrollBy({
                        top: relativeY - targetY,
                        behavior: 'smooth'
                    });
                }
            }

            if (isPlaying) {
                animationFrameId = requestAnimationFrame(updateKaraokeSync);
            }
        }

        // --- Custom Player Controls ---
        function togglePlay() {
            if (audioPlayer.paused) {
                audioPlayer.play();
            } else {
                audioPlayer.pause();
            }
        }

        audioPlayer.addEventListener('play', () => {
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            animationFrameId = requestAnimationFrame(updateKaraokeSync);
        });

        audioPlayer.addEventListener('pause', () => {
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            updateKaraokeSync(); // One final update
        });

        playPauseBtn.addEventListener('click', togglePlay);

        // Click on Progress Bar to seek
        progressBarContainer.addEventListener('click', (e) => {
            const rect = progressBarContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            audioPlayer.currentTime = percentage * audioPlayer.duration;
            if (!isPlaying) updateKaraokeSync();
        });

        // Next / Prev Segment Navigation
        function jumpToSegment(direction) {
            const t = audioPlayer.currentTime;
            
            // Find current segment index
            let currentIdx = validSegments.findIndex(s => s.time_from <= t && s.time_to >= t);
            if (currentIdx === -1) {
                // Not in a segment, find closest
                currentIdx = validSegments.findIndex(s => s.time_from > t);
                if (currentIdx === -1) currentIdx = validSegments.length - 1; // At end
                if (direction === -1) currentIdx -= 1; // If jumping back, go to previous
            } else {
                currentIdx += direction;
            }

            // Clamp
            currentIdx = Math.max(0, Math.min(validSegments.length - 1, currentIdx));
            
            audioPlayer.currentTime = validSegments[currentIdx].time_from;
            if (!isPlaying) updateKaraokeSync();
        }

        prevSegBtn.addEventListener('click', () => jumpToSegment(-1));
        nextSegBtn.addEventListener('click', () => jumpToSegment(1));

        // Format time utility
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
    </script>
</body>
</html>
