<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلاوة القرآن العظيم</title>
    
    <!-- Modern Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-base: #06080e;
            --bg-surface: rgba(13, 17, 27, 0.85);
            --bg-glass: rgba(10, 14, 23, 0.82);
            --bg-pill: rgba(255, 255, 255, 0.05);
            --bg-pill-hover: rgba(255, 255, 255, 0.1);

            --accent-gold: #d4af37;
            --accent-gold-light: #f7df8b;
            --accent-gold-glow: rgba(212, 175, 55, 0.28);
            
            --accent-emerald: #10b981;
            --accent-emerald-light: #34d399;
            --accent-emerald-glow: rgba(16, 185, 129, 0.25);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #526077;

            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-active: rgba(212, 175, 55, 0.35);

            --font-quran: 'Amiri', 'Scheherazade New', serif;
            --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 55%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.04) 0%, transparent 45%);
        }

        /* --- Fullscreen Quran Canvas (No Top Toolbar) --- */
        main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 3rem 1.5rem 8.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        main::-webkit-scrollbar {
            width: 6px;
        }
        main::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .quran-container {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 2.25rem;
        }

        /* --- Empty Dropzone --- */
        .empty-dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4.5rem 2rem;
            background: var(--bg-surface);
            border: 1.5px dashed var(--border-subtle);
            border-radius: 20px;
            text-align: center;
            gap: 1.25rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .empty-dropzone.dragover {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .dropzone-icon {
            width: 68px;
            height: 68px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            color: var(--accent-gold-light);
        }

        .dropzone-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }

        .dropzone-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            max-width: 380px;
            line-height: 1.6;
        }

        /* --- Ayah Card Block --- */
        .ayah-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.75rem 2rem;
            transition: all 0.25s ease;
            position: relative;
        }

        .ayah-card.active-ayah {
            border-color: var(--border-active);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(212, 175, 55, 0.2);
            background: rgba(15, 21, 35, 0.95);
        }

        .ayah-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .ayah-badge {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--accent-gold-light);
            background: rgba(212, 175, 55, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }

        .ayah-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            direction: ltr;
        }

        /* --- Words Flow --- */
        .ayah-words-flow {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: flex-start;
            gap: 1.2rem 1rem;
            line-height: 2.2;
            direction: rtl;
        }

        .quran-word {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            transition: all 0.15s ease;
            position: relative;
        }

        .quran-word:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .word-text {
            font-family: var(--font-quran);
            font-size: 1.95rem;
            color: var(--text-primary);
            transition: color 0.15s ease, transform 0.15s ease;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .quran-word.word-active .word-text {
            color: var(--accent-gold-light);
            text-shadow: 0 0 16px var(--accent-gold-glow);
            transform: scale(1.04);
        }

        /* --- Discreet Phoneme Cluster Underneath --- */
        .phoneme-row {
            display: flex;
            flex-direction: row; /* Right to Left natural matching */
            align-items: center;
            gap: 2px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 5px;
            padding: 1px 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0.65;
            transition: opacity 0.2s;
        }

        .quran-word.word-active .phoneme-row {
            opacity: 1;
            border-color: rgba(212, 175, 55, 0.25);
            background: rgba(0, 0, 0, 0.7);
        }

        .phoneme-pill {
            font-family: var(--font-quran);
            font-size: 0.88rem;
            padding: 0 3px;
            border-radius: 3px;
            color: var(--text-muted);
            transition: all 0.08s ease;
        }

        .phoneme-pill.phoneme-active {
            color: #030712;
            background: var(--accent-emerald-light);
            font-weight: 700;
            box-shadow: 0 0 8px var(--accent-emerald-glow);
            transform: scale(1.15);
        }

        /* --- Minimal Floating Capsule Player (with integrated Import Tools) --- */
        .player-floating-capsule {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: min(880px, calc(100% - 32px));
            background: var(--bg-glass);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
            z-index: 50;
        }

        .import-btn-icon {
            width: 36px;
            height: 36px;
            background: var(--bg-pill);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .import-btn-icon:hover {
            background: var(--bg-pill-hover);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .import-btn-icon.ready {
            background: rgba(16, 185, 129, 0.12);
            color: var(--accent-emerald-light);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .play-toggle-btn {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent-gold), #966f19);
            border: none;
            border-radius: 50%;
            color: #05080f;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--accent-gold-glow);
            flex-shrink: 0;
        }

        .play-toggle-btn:hover {
            transform: scale(1.06);
            filter: brightness(1.1);
        }

        .play-toggle-btn:active {
            transform: scale(0.96);
        }

        .track-center-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 0;
        }

        .track-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
        }

        .current-active-info {
            color: var(--accent-gold-light);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .current-sound-badge {
            color: var(--accent-emerald-light);
            background: rgba(16, 185, 129, 0.12);
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-family: var(--font-quran);
            font-size: 0.8rem;
        }

        .time-display {
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            direction: ltr;
            flex-shrink: 0;
        }

        /* --- Scrub Track --- */
        .scrub-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .scrub-fill {
            position: absolute;
            top: 0;
            right: 0; /* RTL fill */
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-emerald), var(--accent-gold));
            border-radius: 3px;
            transition: width 0.05s linear;
        }

        .speed-dropdown {
            background: var(--bg-pill);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-family: var(--font-ui);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.4rem 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .speed-dropdown:hover {
            background: var(--bg-pill-hover);
            color: #fff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Main Quran Reading Canvas -->
    <main id="mainContent">
        <div class="quran-container" id="quranContainer">
            
            <!-- Empty State / Drop Target -->
            <div class="empty-dropzone" id="emptyDropzone">
                <div class="dropzone-icon"><i class="fas fa-cloud-arrow-up"></i></div>
                <div class="dropzone-title">قم بسحب وإفلات الملفات هنا</div>
                <div class="dropzone-subtitle">
                    اسحب ملف التوقيت (JSON) وملف التلاوة الصوتي (MP3/WAV) لبدء التلاوة الفورية
                </div>
            </div>

            <!-- Ayah Blocks List -->
            <div id="ayahBlocksList"></div>
        </div>
    </main>

    <!-- Sleek Floating Capsule Player (with integrated file loading) -->
    <div class="player-floating-capsule">
        <input type="file" id="jsonInput" accept=".json" class="hidden">
        <input type="file" id="audioInput" accept="audio/*" class="hidden">

        <!-- Import JSON Button -->
        <button class="import-btn-icon" id="btnUploadJson" title="تحميل ملف التوقيت JSON">
            <i class="fas fa-file-code"></i>
        </button>

        <!-- Import Audio Button -->
        <button class="import-btn-icon" id="btnUploadAudio" title="تحميل ملف الصوت MP3">
            <i class="fas fa-file-audio"></i>
        </button>

        <!-- Play / Pause Button -->
        <button class="play-toggle-btn" id="btnPlayPause" title="تشغيل / إيقاف (مسافة)">
            <i class="fas fa-play" id="playIcon"></i>
        </button>

        <!-- Scrub & Meta -->
        <div class="track-center-group">
            <div class="track-meta-row">
                <div class="current-active-info">
                    <span id="labelAyahRef">—</span>
                    <span class="current-sound-badge hidden" id="badgeSound"></span>
                </div>
                <div class="time-display">
                    <span id="timeElapsed">00:00</span> / <span id="timeTotal">00:00</span>
                </div>
            </div>

            <div class="scrub-container" id="scrubContainer">
                <div class="scrub-fill" id="scrubFill"></div>
            </div>
        </div>

        <!-- Playback Speed -->
        <select id="selectSpeed" class="speed-dropdown" title="سرعة التلاوة">
            <option value="0.75">0.75x</option>
            <option value="1.0" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
        </select>
    </div>

    <!-- Hidden Core Audio Engine -->
    <audio id="audioEngine" preload="auto"></audio>

    <script>
        class QuranViewer {
            constructor() {
                this.audio = document.getElementById('audioEngine');
                this.segments = [];
                this.words = [];
                this.phonemes = [];
                this.animFrame = null;

                this.initElements();
                this.bindEvents();
            }

            initElements() {
                this.jsonInput = document.getElementById('jsonInput');
                this.audioInput = document.getElementById('audioInput');
                this.btnUploadJson = document.getElementById('btnUploadJson');
                this.btnUploadAudio = document.getElementById('btnUploadAudio');

                this.emptyDropzone = document.getElementById('emptyDropzone');
                this.ayahBlocksList = document.getElementById('ayahBlocksList');
                this.mainContent = document.getElementById('mainContent');

                this.btnPlayPause = document.getElementById('btnPlayPause');
                this.playIcon = document.getElementById('playIcon');
                this.labelAyahRef = document.getElementById('labelAyahRef');
                this.badgeSound = document.getElementById('badgeSound');
                this.timeElapsed = document.getElementById('timeElapsed');
                this.timeTotal = document.getElementById('timeTotal');
                this.scrubContainer = document.getElementById('scrubContainer');
                this.scrubFill = document.getElementById('scrubFill');
                this.selectSpeed = document.getElementById('selectSpeed');
            }

            bindEvents() {
                // Upload Buttons in Bottom Capsule
                this.btnUploadJson.addEventListener('click', () => this.jsonInput.click());
                this.btnUploadAudio.addEventListener('click', () => this.audioInput.click());

                this.jsonInput.addEventListener('change', (e) => this.handleJsonFile(e.target.files[0]));
                this.audioInput.addEventListener('change', (e) => this.handleAudioFile(e.target.files[0]));

                // Drag and Drop
                window.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.emptyDropzone.classList.add('dragover');
                });
                window.addEventListener('dragleave', (e) => {
                    if (e.clientX === 0 && e.clientY === 0) {
                        this.emptyDropzone.classList.remove('dragover');
                    }
                });
                window.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.emptyDropzone.classList.remove('dragover');
                    Array.from(e.dataTransfer.files).forEach(file => {
                        if (file.name.endsWith('.json')) this.handleJsonFile(file);
                        else if (file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|ogg|m4a)$/i)) this.handleAudioFile(file);
                    });
                });

                // Play / Pause
                this.btnPlayPause.addEventListener('click', () => this.togglePlay());

                // Scrub Bar
                this.scrubContainer.addEventListener('click', (e) => {
                    if (!this.audio.duration) return;
                    const rect = this.scrubContainer.getBoundingClientRect();
                    // RTL seek: right is 0, left is 100%
                    const clickX = e.clientX - rect.left;
                    const ratio = 1 - (clickX / rect.width);
                    this.audio.currentTime = Math.max(0, Math.min(this.audio.duration, ratio * this.audio.duration));
                });

                // Playback Speed
                this.selectSpeed.addEventListener('change', (e) => {
                    this.audio.playbackRate = parseFloat(e.target.value);
                });

                // Audio Events
                this.audio.addEventListener('play', () => {
                    this.playIcon.className = 'fas fa-pause';
                    this.startSync();
                });
                this.audio.addEventListener('pause', () => {
                    this.playIcon.className = 'fas fa-play';
                    this.stopSync();
                });
                this.audio.addEventListener('loadedmetadata', () => {
                    this.timeTotal.textContent = this.formatTime(this.audio.duration);
                });

                // Keyboard Shortcuts
                window.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.togglePlay();
                    } else if (e.code === 'ArrowRight') {
                        e.preventDefault();
                        this.audio.currentTime = Math.max(0, this.audio.currentTime - 3);
                    } else if (e.code === 'ArrowLeft') {
                        e.preventDefault();
                        this.audio.currentTime = Math.min(this.audio.duration || 0, this.audio.currentTime + 3);
                    }
                });
            }

            handleJsonFile(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        this.loadData(data);
                        this.btnUploadJson.classList.add('ready');
                        this.btnUploadJson.title = `ملف التوقيت: ${file.name}`;
                    } catch (err) {
                        alert('خطأ في قراءة ملف JSON: ' + err.message);
                    }
                };
                reader.readAsText(file, 'utf-8');
            }

            handleAudioFile(file) {
                if (!file) return;
                this.audio.src = URL.createObjectURL(file);
                this.btnUploadAudio.classList.add('ready');
                this.btnUploadAudio.title = `ملف الصوت: ${file.name}`;
            }

            loadData(data) {
                this.segments = (data.segments || []).filter(s => s.matched_text && s.matched_text.trim());
                this.words = [];
                this.phonemes = [];

                this.segments.forEach((seg, sIdx) => {
                    const segStart = seg.time_from || 0.0;
                    (seg.words || []).forEach((w, wIdx) => {
                        const wordId = `w_${sIdx}_${wIdx}`;
                        const absStart = w.start !== null ? segStart + w.start : null;
                        const absEnd = w.end !== null ? segStart + w.end : null;

                        const wordObj = {
                            id: wordId,
                            text: w.word,
                            location: w.location,
                            start: absStart,
                            end: absEnd,
                            segmentIndex: sIdx,
                            phonemes: []
                        };

                        if (w.phonemes && Array.isArray(w.phonemes)) {
                            w.phonemes.forEach((p, pIdx) => {
                                const phObj = {
                                    id: `p_${sIdx}_${wIdx}_${pIdx}`,
                                    phoneme: p.phoneme,
                                    start: p.start !== null ? segStart + p.start : null,
                                    end: p.end !== null ? segStart + p.end : null,
                                    wordId: wordId,
                                    segmentIndex: sIdx
                                };
                                wordObj.phonemes.push(phObj);
                                this.phonemes.push(phObj);
                            });
                        }
                        this.words.push(wordObj);
                    });
                });

                this.render();
            }

            render() {
                this.emptyDropzone.classList.add('hidden');
                this.ayahBlocksList.innerHTML = '';

                this.segments.forEach((seg, sIdx) => {
                    const card = document.createElement('div');
                    card.className = 'ayah-card';
                    card.id = `ayah_card_${sIdx}`;

                    // Header
                    const header = document.createElement('div');
                    header.className = 'ayah-header';
                    header.innerHTML = `
                        <span class="ayah-badge">${seg.ref_from || 'آية'} ${seg.ref_to && seg.ref_to !== seg.ref_from ? '→ ' + seg.ref_to : ''}</span>
                        <span class="ayah-time">${this.formatTime(seg.time_from)} - ${this.formatTime(seg.time_to)}</span>
                    `;
                    card.appendChild(header);

                    // Words Flow
                    const flow = document.createElement('div');
                    flow.className = 'ayah-words-flow';

                    const segWords = this.words.filter(w => w.segmentIndex === sIdx);
                    segWords.forEach(w => {
                        const wEl = document.createElement('div');
                        wEl.className = 'quran-word';
                        wEl.id = w.id;

                        const textSpan = document.createElement('span');
                        textSpan.className = 'word-text';
                        textSpan.textContent = w.text;
                        wEl.appendChild(textSpan);

                        if (w.phonemes && w.phonemes.length > 0) {
                            const pRow = document.createElement('div');
                            pRow.className = 'phoneme-row';

                            w.phonemes.forEach(p => {
                                const pSpan = document.createElement('span');
                                pSpan.className = 'phoneme-pill';
                                pSpan.id = p.id;
                                pSpan.textContent = p.phoneme;

                                pSpan.addEventListener('click', (e) => {
                                    e.stopPropagation();
                                    if (p.start !== null) this.seek(p.start);
                                });

                                pRow.appendChild(pSpan);
                            });
                            wEl.appendChild(pRow);
                        }

                        wEl.addEventListener('click', () => {
                            if (w.start !== null) this.seek(w.start);
                        });

                        flow.appendChild(wEl);
                    });

                    card.appendChild(flow);
                    this.ayahBlocksList.appendChild(card);
                });
            }

            togglePlay() {
                if (!this.audio.src) return;
                if (this.audio.paused) this.audio.play();
                else this.audio.pause();
            }

            seek(time) {
                this.audio.currentTime = time;
                if (this.audio.paused) this.audio.play();
            }

            startSync() {
                const step = () => {
                    this.updateSync();
                    if (!this.audio.paused) {
                        this.animFrame = requestAnimationFrame(step);
                    }
                };
                this.animFrame = requestAnimationFrame(step);
            }

            stopSync() {
                if (this.animFrame) cancelAnimationFrame(this.animFrame);
            }

            updateSync() {
                const t = this.audio.currentTime;
                const dur = this.audio.duration || 1;

                // Update Timeline
                this.timeElapsed.textContent = this.formatTime(t);
                this.scrubFill.style.width = `${Math.min(100, (t / dur) * 100)}%`;

                let activeWord = null;
                let activePhoneme = null;
                let activeSegIndex = null;

                // Sync Phonemes (Strict single active sound)
                for (let i = 0; i < this.phonemes.length; i++) {
                    const p = this.phonemes[i];
                    const el = document.getElementById(p.id);
                    if (!el) continue;

                    const isActive = (i === this.phonemes.length - 1)
                        ? (t >= p.start && t <= p.end)
                        : (t >= p.start && t < p.end);

                    if (isActive) {
                        el.classList.add('phoneme-active');
                        activePhoneme = p;
                    } else {
                        el.classList.remove('phoneme-active');
                    }
                }

                // Sync Words (Strict single active word)
                for (let i = 0; i < this.words.length; i++) {
                    const w = this.words[i];
                    const el = document.getElementById(w.id);
                    if (!el) continue;

                    const isActive = (w.start !== null && w.end !== null) &&
                        ((i === this.words.length - 1) ? (t >= w.start && t <= w.end) : (t >= w.start && t < w.end));

                    if (isActive) {
                        el.classList.add('word-active');
                        activeWord = w;
                        activeSegIndex = w.segmentIndex;
                    } else {
                        el.classList.remove('word-active');
                    }
                }

                // Active Ayah Block Highlighting & Smooth Auto Scroll
                if (activeSegIndex !== null) {
                    document.querySelectorAll('.ayah-card').forEach((card, idx) => {
                        if (idx === activeSegIndex) {
                            if (!card.classList.contains('active-ayah')) {
                                card.classList.add('active-ayah');
                                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            }
                        } else {
                            card.classList.remove('active-ayah');
                        }
                    });

                    const seg = this.segments[activeSegIndex];
                    this.labelAyahRef.textContent = `${seg.ref_from || 'آية'} ${seg.ref_to && seg.ref_to !== seg.ref_from ? '→ ' + seg.ref_to : ''}`;

                    if (activePhoneme) {
                        this.badgeSound.classList.remove('hidden');
                        this.badgeSound.textContent = activePhoneme.phoneme;
                    } else {
                        this.badgeSound.classList.add('hidden');
                    }
                }
            }

            formatTime(sec) {
                if (sec === null || isNaN(sec)) return '00:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new QuranViewer();
        });
    </script>
</body>
</html>
