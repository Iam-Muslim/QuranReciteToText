<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلاوة القرآن العظيم</title>
    
    <!-- Modern Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-base: #06080e;
            --bg-surface: rgba(13, 17, 27, 0.85);
            --bg-glass: rgba(10, 14, 23, 0.82);
            --bg-pill: rgba(255, 255, 255, 0.05);
            --bg-pill-hover: rgba(255, 255, 255, 0.1);

            --accent-gold: #d4af37;
            --accent-gold-light: #f7df8b;
            --accent-gold-glow: rgba(212, 175, 55, 0.28);
            
            --accent-emerald: #10b981;
            --accent-emerald-light: #34d399;
            --accent-emerald-glow: rgba(16, 185, 129, 0.25);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #526077;

            --border-subtle: rgba(255, 255, 255, 0.07);
            --border-active: rgba(212, 175, 55, 0.35);

            --font-quran: 'Amiri', 'Scheherazade New', serif;
            --font-ui: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-ui);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 55%),
                radial-gradient(circle at 100% 100%, rgba(16, 185, 129, 0.04) 0%, transparent 45%);
        }

        /* --- Fullscreen Quran Canvas (No Top Toolbar) --- */
        main {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 3rem 1.5rem 8.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            scroll-behavior: smooth;
        }

        main::-webkit-scrollbar {
            width: 6px;
        }
        main::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .quran-container {
            width: 100%;
            max-width: 920px;
            display: flex;
            flex-direction: column;
            gap: 2.25rem;
        }

        /* --- Empty Dropzone --- */
        .empty-dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4.5rem 2rem;
            background: var(--bg-surface);
            border: 1.5px dashed var(--border-subtle);
            border-radius: 20px;
            text-align: center;
            gap: 1.25rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .empty-dropzone.dragover {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .dropzone-icon {
            width: 68px;
            height: 68px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            color: var(--accent-gold-light);
        }

        .dropzone-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
        }

        .dropzone-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            max-width: 380px;
            line-height: 1.6;
        }

        /* --- Ayah Card Block --- */
        .ayah-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.75rem 2rem;
            transition: all 0.25s ease;
            position: relative;
        }

        .ayah-card.active-ayah {
            border-color: var(--border-active);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(212, 175, 55, 0.2);
            background: rgba(15, 21, 35, 0.95);
        }

        .ayah-badges-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .badge-flag {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.2rem 0.55rem;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .badge-repetition {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .badge-missing {
            color: #f87171;
            background: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }

        .review-gap-pill {
            font-size: 0.72rem;
            font-weight: 500;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
            border: 1px dashed rgba(251, 191, 36, 0.35);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.2s ease;
        }

        .review-gap-pill:hover {
            background: rgba(251, 191, 36, 0.2);
            transform: translateY(-1px);
        }

        .ayah-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            gap: 1rem;
            flex-wrap: wrap;
        }

        .ayah-badge {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--accent-gold-light);
            background: rgba(212, 175, 55, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }

        .ayah-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            direction: ltr;
        }

        .ayah-words-flow {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: flex-start;
            gap: 1.2rem 1rem;
            line-height: 2.2;
            direction: rtl;
        }

        .quran-word {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 0.2rem 0.4rem;
            border-radius: 8px;
            transition: all 0.15s ease;
            position: relative;
        }

        .word-text {
            font-family: var(--font-quran);
            font-size: 1.95rem;
            color: var(--text-primary);
            transition: color 0.15s ease, transform 0.15s ease;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .quran-word.word-active .word-text {
            color: var(--accent-gold-light);
            text-shadow: 0 0 16px var(--accent-gold-glow);
            transform: scale(1.04);
        }

        .phoneme-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 2px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 5px;
            padding: 1px 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            opacity: 0.65;
            transition: opacity 0.2s;
        }

        .quran-word.word-active .phoneme-row {
            opacity: 1;
            border-color: rgba(212, 175, 55, 0.25);
            background: rgba(0, 0, 0, 0.7);
        }

        .phoneme-pill {
            font-family: var(--font-quran);
            font-size: 0.88rem;
            padding: 0 3px;
            border-radius: 3px;
            color: var(--text-muted);
            transition: all 0.08s ease;
        }

        .phoneme-pill.phoneme-active {
            color: #030712;
            background: var(--accent-emerald-light);
            font-weight: 700;
            text-shadow: none;
            box-shadow: 0 0 8px var(--accent-emerald-glow);
        }

        .player-capsule-wrapper {
            position: fixed;
            bottom: 1.75rem;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
            padding: 0 1rem;
        }

        .player-capsule {
            pointer-events: auto;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: 9999px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            padding: 0.55rem 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            max-width: 900px;
            width: 100%;
        }

        .capsule-btn {
            background: var(--bg-pill);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            height: 38px;
            padding: 0 1rem;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .capsule-btn:hover {
            background: var(--bg-pill-hover);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .capsule-btn.ready {
            border-color: rgba(16, 185, 129, 0.4);
            color: var(--accent-emerald-light);
            background: rgba(16, 185, 129, 0.08);
        }

        .play-btn-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), #b89628);
            color: #06080e;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            cursor: pointer;
            box-shadow: 0 4px 16px var(--accent-gold-glow);
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .play-btn-circle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
        }

        .capsule-timeline {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 140px;
        }

        .timeline-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .ayah-label-ref {
            color: var(--accent-gold-light);
            font-weight: 600;
            font-size: 0.8rem;
        }

        .scrub-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 9999px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: height 0.15s;
        }

        .scrub-bar-container:hover {
            height: 7px;
        }

        .scrub-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-emerald));
            border-radius: 9999px;
            transition: width 0.05s linear;
        }

        .sound-badge {
            font-family: var(--font-quran);
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-emerald-light);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 0.1rem 0.55rem;
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .capsule-select {
            background: var(--bg-pill);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 0.35rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.78rem;
            cursor: pointer;
            outline: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <main id="mainContent">
        <div class="quran-container">
            <div class="empty-dropzone" id="emptyDropzone">
                <div class="dropzone-icon"><i class="fas fa-quran"></i></div>
                <div class="dropzone-title">عرض وتتبع التلاوة المباركة</div>
                <div class="dropzone-subtitle">قم برفع ملف التوقيت (output.json) وملف الصوت (audio.mp3) لبدء المزامنة</div>
            </div>
            <div id="ayahBlocksList" style="display: flex; flex-direction: column; gap: 2rem;"></div>
        </div>
    </main>

    <div class="player-capsule-wrapper">
        <div class="player-capsule">
            <button class="capsule-btn" id="btnUploadJson"><i class="fas fa-file-code"></i> <span>JSON</span></button>
            <input type="file" id="jsonInput" accept=".json" class="hidden">
            <button class="capsule-btn" id="btnUploadAudio"><i class="fas fa-volume-up"></i> <span>Audio</span></button>
            <input type="file" id="audioInput" accept="audio/*" class="hidden">
            <button class="play-btn-circle" id="btnPlayPause"><i class="fas fa-play" id="playIcon"></i></button>
            <div class="sound-badge hidden" id="badgeSound"></div>
            <div class="capsule-timeline">
                <div class="timeline-meta">
                    <span class="ayah-label-ref" id="labelAyahRef">---</span>
                    <div><span id="timeElapsed">00:00</span> / <span id="timeTotal">00:00</span></div>
                </div>
                <div class="scrub-bar-container" id="scrubContainer"><div class="scrub-fill" id="scrubFill"></div></div>
            </div>
            <select class="capsule-select" id="selectSpeed">
                <option value="0.75">0.75x</option><option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option><option value="1.5">1.5x</option>
            </select>
        </div>
    </div>

    <script>
        class QuranViewer {
            constructor() {
                this.audio = new Audio();
                this.segments = [];
                this.canonicalWords = [];
                this.timeOccurrences = [];
                this.phonemeOccurrences = [];
                this.animFrame = null;
                this.initElements();
                this.bindEvents();
            }

            initElements() {
                this.jsonInput = document.getElementById('jsonInput');
                this.audioInput = document.getElementById('audioInput');
                this.btnUploadJson = document.getElementById('btnUploadJson');
                this.btnUploadAudio = document.getElementById('btnUploadAudio');
                this.ayahBlocksList = document.getElementById('ayahBlocksList');
                this.btnPlayPause = document.getElementById('btnPlayPause');
                this.playIcon = document.getElementById('playIcon');
                this.labelAyahRef = document.getElementById('labelAyahRef');
                this.badgeSound = document.getElementById('badgeSound');
                this.timeElapsed = document.getElementById('timeElapsed');
                this.timeTotal = document.getElementById('timeTotal');
                this.scrubContainer = document.getElementById('scrubContainer');
                this.scrubFill = document.getElementById('scrubFill');
            }

            bindEvents() {
                this.btnUploadJson.addEventListener('click', () => this.jsonInput.click());
                this.btnUploadAudio.addEventListener('click', () => this.audioInput.click());
                this.jsonInput.addEventListener('change', (e) => this.handleJsonFile(e.target.files[0]));
                this.audioInput.addEventListener('change', (e) => this.handleAudioFile(e.target.files[0]));
                this.btnPlayPause.addEventListener('click', () => this.togglePlay());
                this.scrubContainer.addEventListener('click', (e) => {
                    if (!this.audio.duration) return;
                    const rect = this.scrubContainer.getBoundingClientRect();
                    const ratio = 1 - ((e.clientX - rect.left) / rect.width);
                    this.audio.currentTime = Math.max(0, Math.min(this.audio.duration, ratio * this.audio.duration));
                });
                this.audio.addEventListener('play', () => { this.playIcon.className = 'fas fa-pause'; this.startSync(); });
                this.audio.addEventListener('pause', () => { this.playIcon.className = 'fas fa-play'; this.stopSync(); });
                this.audio.addEventListener('loadedmetadata', () => this.timeTotal.textContent = this.formatTime(this.audio.duration));
            }

            handleJsonFile(file) {
                const reader = new FileReader();
                reader.onload = (e) => { this.loadData(JSON.parse(e.target.result)); this.btnUploadJson.classList.add('ready'); };
                reader.readAsText(file);
            }

            handleAudioFile(file) {
                this.audio.src = URL.createObjectURL(file);
                this.btnUploadAudio.classList.add('ready');
            }

            loadData(data) {
                this.segments = (data.segments || []).filter(s => s.matched_text);
                this.canonicalWords = [];
                this.timeOccurrences = [];
                this.phonemeOccurrences = [];
                this.segments.forEach((seg, sIdx) => {
                    const segStart = seg.time_from || 0;
                    const wordMap = new Map();
                    const wordsList = seg.words || [];

                    // Extract acoustic review gaps (>= 1.0s)
                    const gaps = [];
                    for (let i = 0; i < wordsList.length - 1; i++) {
                        const currEnd = wordsList[i].end !== null ? segStart + wordsList[i].end : null;
                        const nextStart = wordsList[i + 1].start !== null ? segStart + wordsList[i + 1].start : null;
                        if (currEnd !== null && nextStart !== null && (nextStart - currEnd) >= 1.0) {
                            gaps.push({
                                start: currEnd,
                                end: nextStart,
                                duration: (nextStart - currEnd).toFixed(1)
                            });
                        }
                    }
                    seg._reviewGaps = gaps;

                    wordsList.forEach((w, wIdx) => {
                        const loc = w.location || `loc_${wIdx}`;
                        const absStart = w.start !== null ? segStart + w.start : null;
                        const absEnd = w.end !== null ? segStart + w.end : null;
                        let entry = wordMap.get(loc);
                        if (!entry) {
                            entry = { id: `w_${sIdx}_${loc.replace(/[:.]/g, '_')}`, text: w.word, segmentIndex: sIdx, passes: [], phonemes: [] };
                            wordMap.set(loc, entry);
                            this.canonicalWords.push(entry);
                        }
                        entry.passes.push({ start: absStart, end: absEnd });
                        this.timeOccurrences.push({ wordId: entry.id, segmentIndex: sIdx, start: absStart, end: absEnd });
                        (w.phonemes || []).forEach((p, pIdx) => {
                            const phId = `p_${sIdx}_${loc.replace(/[:.]/g, '_')}_${pIdx}`;
                            if (entry.passes.length === 1) entry.phonemes.push({ id: phId, phoneme: p.phoneme, start: p.start + segStart });
                            this.phonemeOccurrences.push({ id: phId, start: p.start + segStart, end: p.end + segStart, wordId: entry.id, segmentIndex: sIdx });
                        });
                    });
                });
                this.render();
            }

            render() {
                document.getElementById('emptyDropzone').classList.add('hidden');
                this.ayahBlocksList.innerHTML = this.segments.map((seg, sIdx) => {
                    const repBadge = seg.has_repeated_words ? `<span class="badge-flag badge-repetition"><i class="fas fa-redo"></i> تكرار مرتل</span>` : '';
                    const missBadge = seg.has_missing_words ? `<span class="badge-flag badge-missing"><i class="fas fa-exclamation-triangle"></i> كلمات ناقصة</span>` : '';
                    const gapBadges = (seg._reviewGaps || []).map(g => `<span class="review-gap-pill" onclick="window.app.seek(${g.start})" title="انقر للاستماع للفاصل الصوتي"><i class="fas fa-headphones"></i> مراجعة فاصل (${g.duration}s)</span>`).join('');
                    const segWords = this.canonicalWords.filter(w => w.segmentIndex === sIdx);

                    return `
                    <div class="ayah-card" id="ayah_card_${sIdx}">
                        <div class="ayah-header">
                            <div class="ayah-badges-group">
                                <span class="ayah-badge">${seg.ref_from || 'آية'} ${seg.ref_to && seg.ref_to !== seg.ref_from ? '→ ' + seg.ref_to : ''}</span>
                                ${repBadge}
                                ${missBadge}
                                ${gapBadges}
                            </div>
                            <span class="ayah-time">${this.formatTime(seg.time_from)} - ${this.formatTime(seg.time_to)}</span>
                        </div>
                        <div class="ayah-words-flow">
                            ${segWords.map(w => `
                                <div class="quran-word" id="${w.id}" onclick="window.app.seek(${w.passes[0]?.start ?? 0})">
                                    <span class="word-text">${w.text}</span>
                                    <div class="phoneme-row">${w.phonemes.map(p => `<span class="phoneme-pill" id="${p.id}" onclick="event.stopPropagation(); window.app.seek(${p.start})">${p.phoneme}</span>`).join('')}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    `;
                }).join('');
            }

            togglePlay() { this.audio.paused ? this.audio.play() : this.audio.pause(); }
            seek(t) { this.audio.currentTime = t; if (this.audio.paused) this.audio.play(); }
            startSync() { const step = () => { this.updateSync(); if (!this.audio.paused) this.animFrame = requestAnimationFrame(step); }; this.animFrame = requestAnimationFrame(step); }
            stopSync() { cancelAnimationFrame(this.animFrame); }
            updateSync() {
                const t = this.audio.currentTime;
                this.timeElapsed.textContent = this.formatTime(t);
                this.scrubFill.style.width = `${Math.min(100, (t / (this.audio.duration || 1)) * 100)}%`;
                // 1. Sync Active Words
                const activeWords = new Set();
                let activeSegIdx = null;
                this.timeOccurrences.forEach(o => {
                    if (o.start !== null && o.end !== null && t >= o.start && t < o.end) {
                        activeWords.add(o.wordId);
                        activeSegIdx = o.segmentIndex;
                    }
                });
                document.querySelectorAll('.quran-word').forEach(el => el.classList.toggle('word-active', activeWords.has(el.id)));

                // 2. Sync Active Phonemes (Only activates if its parent word is active)
                let activePhoneme = null;
                const activeIds = new Set();
                this.phonemeOccurrences.forEach(p => {
                    if (p.start !== null && p.end !== null && t >= p.start && t < p.end) {
                        if (activeWords.has(p.wordId)) {
                            activeIds.add(p.id);
                            activePhoneme = p;
                        }
                    }
                });
                document.querySelectorAll('.phoneme-pill').forEach(el => el.classList.toggle('phoneme-active', activeIds.has(el.id)));

                if (activeSegIdx !== null) {
                    document.querySelectorAll('.ayah-card').forEach((c, i) => {
                        if (i === activeSegIdx && !c.classList.contains('active-ayah')) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        c.classList.toggle('active-ayah', i === activeSegIdx);
                    });
                    this.badgeSound.classList.toggle('hidden', !activePhoneme);
                    if (activePhoneme) this.badgeSound.textContent = activePhoneme.phoneme;
                }
            }
            formatTime(s) { const m = Math.floor(s / 60); const sec = Math.floor(s % 60); return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`; }
        }
        window.addEventListener('DOMContentLoaded', () => window.app = new QuranViewer());
    </script>
</body>
